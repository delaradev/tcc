project:
  name: CPIC_Brazil_Article_Reproducible
  version: 3.0.0
  seed: 42

# Config para validar a generalização geográfica na região da AMAJA (Seção 4.4 do TCC).
# Só precisa de data.balanced_path (aponta para os tiles gerados por src/data/tiles.py
# e revisados em src/data/review_tiles.py) e training.loss (alpha/beta do modelo
# treinado, usados para reconstruir a loss como custom_object ao carregar o .keras).
#
# Uso: python src/main.py --mode validate --config config/config_amaja.yaml \
#        --model runs/<run>/best_model.keras
data:
  balanced_path: data/dataset_amaja_final # valid_images/ + valid_masks/, após tiles.py + review_tiles.py (validação humana)

# Sem seção `model:` de propósito: --mode predict/export/validate carregam a
# arquitetura e os pesos direto do .keras salvo (tf.keras.models.load_model), nunca a
# reconstroem a partir de config — um `model:` aqui seria só decorativo (podendo
# inclusive divergir do modelo real sem ninguém perceber).

training:
  loss:
    name: tversky
    alpha: 0.7
    beta: 0.3
